services:
  # mock server: vsftpd + sshd, the remote target for the tests
  server:
    build: .

  # phpunit runner: mounts the project and talks to the server over this
  # compose network (REMOTE_HOST=server, see Tests/PHPUnit.xml)
  runner:
    build:
      context: ../..
      dockerfile: Tests/docker/runner/Dockerfile
    depends_on:
      - server
    volumes:
      - ../..:/app
      - vendor:/app/vendor

volumes:
  vendor:
