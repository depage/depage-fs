# sshd settings for the test environment

# only present the fixed RSA host key, so the SSH_FINGERPRINT the tests
# expect always matches
HostKey /etc/ssh/ssh_host_rsa_key
HostKeyAlgorithms ssh-rsa,rsa-sha2-512,rsa-sha2-256

# re-enable RSA key signatures (disabled by default since OpenSSH 8.8),
# which the PHP ssh2 extension relies on
PubkeyAcceptedAlgorithms +ssh-rsa

PasswordAuthentication yes

# the test user's home directory is bind-mounted from the host, so file
# ownership cannot be guaranteed here
StrictModes no
